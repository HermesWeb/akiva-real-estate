backend:
  name: git-gateway
  branch: main 

media_folder: "images/insights"
public_folder: "images/insights"

collections:
  - name: "insights"
    label: "Akiva Insights"
    folder: "insights"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "thumbnail", widget: "image", required: false}
      - {label: "Article Body", name: "body", widget: "markdown"}
